[package]
name = "tines"
version = "0.2.3"
edition = "2024"
license = "MIT"
description = "Your agents on every machine, one pack, through letmeknow"
repository = "https://github.com/spoj/tines"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
humantime = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
strip = true
